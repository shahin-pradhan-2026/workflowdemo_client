<!-- ==========Slider Add Modal======== -->

<ng-template #modalSlider let-modal>
  <div class="modal-header">
    <h4 class="modal-title" id="modal-basic-title">Slider Information</h4>
  </div>
  <div class="modal-body">
    <div class="col-md-12">
      <div class="mb-2 row">
        <label for="countryName" class="col-md-5 col-form-label">Slider Name</label>
        <div class="col-md-7">
          <input id="countryName" class="form-control" type="text" [(ngModel)]="selectedSlider.sliderText">
        </div>
      </div> 
      <div class="mb-2 row">
        <label for="countryNameBangla" class="col-md-5 col-form-label">Slider Image</label>
        <div class="col-md-7">
          <input id="countryNameBangla" class="form-control" type="file" [(ngModel)]="selectedSlider.sliderImage">
        </div>
      </div>
      <!-- <div class="mb-2 row">
        <label for="Status" class="col-md-5 col-form-label">Status</label>
        <div class="col-md-7">
          <div class="form-check form-switch form-switch-md mb-3">
            <input class="form-check-input" type="checkbox" [(ngModel)]="selectedSlider.isActive"
              id="Status" checked>
          </div>
        </div>
      </div> -->
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-danger" (click)="modalClose()"><i class="fas fa-times"></i>
      Close</button>
    <button type="button" class="btn btn-success" (click)="saveSlider()"><i class="fas fa-save"></i>
      Save</button>
  </div>
</ng-template>
<!-- ==========Slider Add Modal======== -->

<div class="container-fluid">
  <app-page-title title="Slider List"></app-page-title>
  <div class="row">
    <div class="col-md-10 my-1">
      <button (click)="addSlider()" class="btn btn-success me-1"><i class="fa fa-plus"></i> Add New</button>
      <!-- <button *ngIf="selectedSlider.countryID > 0" (click)="editSlider()" class="btn btn-primary mx-1"><i
          class="fa fa-edit"></i> Edit Slider</button> -->
      <!-- <button (click)="updateOrder()" class="btn btn-dark mx-1"><i class="fa fa-check"></i> Update Order</button> -->
      <button (click)="onBtnExport()" class="btn btn-outline-info mx-1"><i class="fas fa-file-excel"></i> Excel</button>
    </div>

    <div class="col-lg-12">
      <ag-grid-angular style="width: 100%; height: 75vh;" class="ag-theme-alpine" [rowData]="lstSlider"
        [columnDefs]="columnDefs" [gridOptions]="gridOptions" (selectionChanged)="onSelect()"
        (gridReady)="onGridReady($event)">
      </ag-grid-angular>
    </div>
  </div>
</div>
