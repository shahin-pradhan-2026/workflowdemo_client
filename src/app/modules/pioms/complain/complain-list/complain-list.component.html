<div class="container-fluid">
  <app-page-title [title]="labelPageTitle"></app-page-title>

  <!-- Filter Card -->
  <div class="card mb-2 p-2">
    <div class="card-body p-2">
      <form [formGroup]="reactiveFormSearchComplain">
        <div class="row g-3">

          <!-- From Date -->
          <div class="col-md-3">
            <label for="fromDate" class="form-label">From Date</label>
            <input id="fromDate" type="date" class="form-control"
              formControlName="fromDate">
          </div>

          <!-- To Date -->
          <div class="col-md-3">
            <label for="toDate" class="form-label">To Date</label>
            <input id="toDate" type="date" class="form-control"
              formControlName="toDate">
          </div>

          <!-- Complain ID -->
          <!-- <div class="col-md-3">
            <label for="complainID" class="form-label">Complain ID</label>
            <input id="complainID" type="text" class="form-control"
              formControlName="complainID" placeholder="Enter Complain ID">
          </div> -->


         
          <div class="col-md-3">
            <label for="agentName" class="form-label">Applicant Name</label>
            <input id="agentName" type="text" class="form-control"
              formControlName="agentName" placeholder="Enter Applicant Name">
          </div>

     
          <!-- Filter Button -->
          <div class="col-md-3 d-flex align-items-end">
            <button type="button" class="btn btn-primary btn-sm w-100" 
              >
              <i class="fa fa-filter me-1"></i> Filter
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="card mb-2 p-2">
    <div class="row align-items-center">
      <div class="col-md-6 mb-1">
        <!-- <button class="btn btn-primary btn-theme me-2"
                (click)="addNewComplain()">
          <i class="fa fa-user me-1"></i> Add New Requst
        </button> -->

        <button *ngIf="selectedComplainDetails.complainID > 0"
                class="btn btn-primary btn-theme"
                (click)="editComplain()">
          <i class="fa fa-edit me-1"></i> Edit Request
        </button>
      </div>

      <div class="col-md-6 text-end mb-1">
        <button class="btn btn-outline-primary ">
          Total <span class="badge bg-primary p-1">{{ lstComplainDetails.length }}</span>
        </button>
      </div>
    </div>
  </div>

  <!-- AG Grid -->
  <div class="card p-2">
    <div class="card-body p-0">
      <ag-grid-angular
        style="width: 100%; height: 75vh;"
        class="ag-theme-alpine"
        [rowData]="lstComplainDetails"
        [columnDefs]="columnDefs"
        [gridOptions]="gridOptions"
        (selectionChanged)="onSelect()"
        (gridReady)="onGridReady($event)">
      </ag-grid-angular>
    </div>
  </div>
</div>
