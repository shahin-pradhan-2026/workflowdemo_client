<div class="container-fluid">
  <app-page-title title="Agent Report"></app-page-title>
  <div class="row">
    <div class="col-md-12">
      <div class="card mb-1">
        <div class="card-body p-3">
          <div class="row">
            <!-- Left: form fields -->
            <div class="col-md-4">
              <div class="row mb-2">
                <label class="col-md-12 control-label mb-0">User ID</label>
                <div class="col-md-12">
                  <input type="text" class="form-control" [(ngModel)]="objAgentFaceRegistration.agentCode"
                    placeholder="User ID">
                </div>
              </div>

              <div class="row mb-2">
                <label class="col-md-12 control-label mb-0">Unit</label>
                <div class="col-md-12">
                  <input type="text" class="form-control" [(ngModel)]="objAgentFaceRegistration.presentUnit"
                    placeholder="Unit">
                </div>
              </div>

              <div class="row mb-2">
                <label class="col-md-12 control-label mb-0">Mobile</label>
                <div class="col-md-12">
                  <input type="text" class="form-control" [(ngModel)]="objAgentFaceRegistration.mobile"
                    placeholder="Mobile">
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="row mb-2">
                <label class="col-md-12 control-label mb-0">Agent Name</label>
                <div class="col-md-12">
                  <input type="text" class="form-control" [(ngModel)]="objAgentFaceRegistration.agentName"
                    placeholder="Name">
                </div>
              </div>
              <div class="row mb-2">
                <label class="col-md-12 control-label mb-0">Agent Code</label>
                <div class="col-md-12">
                  <input type="text" class="form-control" [(ngModel)]="objAgentFaceRegistration.agentCode"
                    placeholder="Name">
                </div>
              </div>

              <div class="row mb-2">
                <label class="col-md-12 control-label mb-0">Requested On</label>
                <div class="col-md-12">
                  <input type="date" class="form-control" [(ngModel)]="objAgentFaceRegistration.requestedOn">
                </div>
              </div>
            </div>

            <!-- Right: face images and actions -->
            <div class="col-md-4 ">
              <div class="row">
                <ng-container *ngFor="let img of (objAgentFaceRegistration.faceImages || []).slice(0,4); let i = index">
                  <div class="col-md-3 px-1 ">
                    <div class="card text-center border border-primary mb-1">
                      <div class="card-body p-2">
                        <div class="face-remove"><i class="fa fa-trash"></i></div>
                        <img [src]="img || '../../../../../assets/images/pioms/face/face.jpg'" alt="Face {{i+1}}"
                          class="rounded-circle" style="width:70px; height:70px; object-fit:cover; ">
                        <!-- <div class="mt-1">Face {{ i + 1 }}</div> -->
                      </div>
                    </div>
                  </div>
                </ng-container>

              </div>

              <div class="text-end mt-2">
                <button class="btn btn-success me-2" (click)="acceptFace()">Accept</button>
                <button class="btn btn-danger" (click)="rejectFace()">Reject</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-6 my-1">
      <button *ngIf="selectedAgentFaceRegistration.agentFaceRegistrationID > 0" (click)="editAgentFaceRegistration()"
        class="btn btn-primary mx-1"><i class="fa fa-edit"></i> Edit</button>
      <button (click)="onBtnExport()" class="btn btn-outline-info mx-1"><i class="fas fa-file-excel"></i> Excel</button>
    </div>
    <div class="col-md-6">
      <div class="row ">
        <div class="col-md-6"></div>
        <div class="col-md-6">
          <div class="row mt-1">
            <label for="" class="col-md-4 text-end">Filter By</label>
            <div class="col-md-8">
              <select class="form-select" [(ngModel)]="objAgentFaceRegistration.requestStatusID"
                (change)="changeRequestStatus(objAgentFaceRegistration.requestStatusID)">
                <option value="1">New Request</option>
                <option value="2">Accepted</option>
                <option value="3">Rejected</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-12">
      <ag-grid-angular style="width: 100%; height: 75vh;" class="ag-theme-alpine" [rowData]="lstAgentFaceRegistration"
        [columnDefs]="columnDefs" [gridOptions]="gridOptions" (selectionChanged)="onSelect()"
        (gridReady)="onGridReady($event)">
      </ag-grid-angular>
    </div>
  </div>
</div>
