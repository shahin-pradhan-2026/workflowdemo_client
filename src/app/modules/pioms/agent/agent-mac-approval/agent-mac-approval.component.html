<!-- ==========AgentMacApproval Add Modal======== -->
<ng-template #modalAgentMacApproval let-modal>
  <div class="modal-header">
    <h4 class="modal-title" id="modal-basic-title">Agent MAC Approval</h4>
  </div>
  <div class="modal-body">
    <div class="col-md-12">
      <div class="mb-2 row">
        <label for="userID" class="col-md-5 col-form-label">User ID</label>
        <div class="col-md-7">
          <input id="userID" class="form-control" type="text"
            [(ngModel)]="selectedAgentMacApproval.userID" placeholder="User ID">
        </div>
      </div>

      <div class="mb-2 row">
        <label for="agentName" class="col-md-5 col-form-label">Agent Name</label>
        <div class="col-md-7">
          <input id="agentName" class="form-control" type="text"
            [(ngModel)]="selectedAgentMacApproval.agentName" placeholder="Agent Name">
        </div>
      </div>

      <div class="mb-2 row">
        <label for="mobile" class="col-md-5 col-form-label">Mobile</label>
        <div class="col-md-7">
          <input id="mobile" class="form-control" type="text"
            [(ngModel)]="selectedAgentMacApproval.mobile" placeholder="Mobile">
        </div>
      </div>

      <div class="mb-2 row">
        <label for="unit" class="col-md-5 col-form-label">Unit</label>
        <div class="col-md-7">
          <input id="unit" class="form-control" type="text"
            [(ngModel)]="selectedAgentMacApproval.unit" placeholder="Unit">
        </div>
      </div>

      <div class="mb-2 row">
        <label for="requestedMAC" class="col-md-5 col-form-label">Requested MAC</label>
        <div class="col-md-7">
          <input id="requestedMAC" class="form-control" type="text"
            [(ngModel)]="selectedAgentMacApproval.requestedMAC" placeholder="e.g., 00:1A:2B:3C:4D:5E">
        </div>
      </div>

      <div class="mb-2 row">
        <label for="requestedDate" class="col-md-5 col-form-label">Requested Date</label>
        <div class="col-md-7">
          <input id="requestedDate" class="form-control" type="date"
            [(ngModel)]="selectedAgentMacApproval.requestedDate">
        </div>
      </div>

      <div class="mb-2 row">
        <label for="status" class="col-md-5 col-form-label">Status</label>
        <div class="col-md-7">
          <select  class="form-select" [(ngModel)]="selectedAgentMacApproval.status">
            <option value="">-- Select Status --</option>
            <option value="Approve">Approve</option>
            <option value="Reject">Reject</option>
            <option value="Pending">Pending</option>
          </select>
        </div>
      </div>

      <div class="mb-2 row">
        <label for="isActive" class="col-md-5 col-form-label">Active</label>
        <div class="col-md-7">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" [(ngModel)]="selectedAgentMacApproval.isActive"
              id="isActive">
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-danger" (click)="modalClose()"><i class="fas fa-times"></i> Close</button>
    <button type="button" *ngIf="!selectedAgentMacApproval.agentMacApprovalID" class="btn btn-success"
      (click)="saveAgentMacApproval()"><i class="fas fa-save"></i> Save</button>
    <button type="button" *ngIf="selectedAgentMacApproval.agentMacApprovalID > 0" class="btn btn-success"
      (click)="updateAgentMacApproval()"><i class="fas fa-save"></i> Update</button>
  </div>
</ng-template>
<!-- ==========AgentMacApproval Add Modal======== -->

<div class="container-fluid">
  <app-page-title title="Agent Mac Approval"></app-page-title>

  <div class="row">
    <div class="col-md-4 my-1">
      <!-- <button (click)="addAgentMacApproval()" class="btn btn-success me-1"><i class="fa fa-plus"></i> Add New</button> -->
      <button *ngIf="selectedAgentMacApproval.agentMacApprovalID > 0" (click)="editAgentMacApproval()"
        class="btn btn-primary mx-1"><i class="fa fa-edit"></i> Edit</button>
      <!-- <button (click)="updateOrder()" class="btn btn-dark mx-1"><i class="fa fa-check"></i> Update Order</button> -->
      <button (click)="onBtnExport()" class="btn btn-outline-info mx-1"><i class="fas fa-file-excel"></i> Excel</button>
    </div>
    <div class="col-md-8">
      
    </div>


    <div class="col-lg-12">
      <ag-grid-angular style="width: 100%; height: 75vh;" class="ag-theme-alpine" [rowData]="lstAgentMacApproval"
        [columnDefs]="columnDefs" [gridOptions]="gridOptions" (selectionChanged)="onSelect()"
        (gridReady)="onGridReady($event)">
      </ag-grid-angular>
    </div>
  </div>
</div>
