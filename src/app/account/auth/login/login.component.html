<div class="hold-transition theme-fruit bg-img" style="background-color: #F5FFF5;height: 100vh;">
 
  <div class="account-pages" style="margin-top: 2%;">
    <div class="container">

      <div class=" overflow-hidden">
    
        <div>
          <div class="row">
            <div class="col-12 align-self-center">
              <div class="text-center py-3 px-3">
                <div class="text-center">
                 
           <h3 class="brand-name mb-2">Workflow System</h3>
    <h2 class="login-title">Login</h2>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="card-body pt-0">

          <div class="px-2 py-2">
            <form class="form-horizontal" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
              <ngb-alert type="danger" *ngIf="error" [dismissible]="false">{{ error }}</ngb-alert>
              <div class="mb-3">
                <label for="email">Username</label>
                <input type="text" formControlName="email" class="form-control" id="email" placeholder="Login Id"
                  [ngClass]="{ 'is-invalid': submitted && f.email.errors }" />
                <div *ngIf="submitted && f.email.errors" class="invalid-feedback">
                  <div *ngIf="f.email.errors.required">User ID is required</div>
                  <div *ngIf="f.email.errors.email">Must be a valid User ID</div>
                </div>
              </div>

              <div class="mb-3">
                <label for="password">Password</label>
                <div class="input-group auth-pass-inputgroup">
                  <input [type]="UserPassword" class="form-control" formControlName="password"
                    placeholder="Enter password" [ngClass]="{ 'is-invalid': submitted && f.password.errors }"
                    aria-label="Password" aria-describedby="password-addon">

                  <button (click)="onCPasswordToggle()" class="btn btn-light ms-0"
                    style=" border-top-right-radius: 10px; border-bottom-right-radius: 10px; " type="button"
                    id="password-addon">
                    <i class="fa fa-eye" aria-hidden="true" *ngIf="showPass"></i>
                    <i class="fa fa-eye-slash" aria-hidden="true" *ngIf="!showPass"></i>
                  </button>
                  <div *ngIf="submitted && f.password.errors" class="invalid-feedback">
                    <span *ngIf="f.password.errors.required">Password is required</span>
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-12 d-none">
                  <div class="form-check">
                    <input class="form-check-input" formControlName="rememberMe" id="rememberMe" type="checkbox" id="remember-check">
                    <label class="form-check-label text-muted" for="remember-check" style=" margin-top: -4px; ">
                      Remember me
                    </label>
                  </div>
                </div>
                <div class="col-12">
                  <div class="text-end">
                  
                  </div>
                </div>
              </div>

              <div class="mt-3 d-grid">
                <button class="btn btn-primary base-color" style="border-radius: 10px;font-size: 16px;" type="submit">Login</button>
              </div>
            </form>
          </div>

        </div>
      </div>
      <div class="mt-5 text-center">
      </div>

    </div>
  </div>
</div>

<!-- end page -->
