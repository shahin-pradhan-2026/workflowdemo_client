  <script>
    function portraitPrintHTML(divName) {

      var mywindow = window.open('', 'PRINT', 'height=400,width=600');
      mywindow.document.write('<html><head><title></title>');
      mywindow.document.write('<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">');
      mywindow.document.write('<link href="/styles.scss" rel="stylesheet">');
      mywindow.document.write('<style>');
      mywindow.document.write('@media print{');
      mywindow.document.write('@page {size: A4;margin: 15mm 20mm;color: #000}');
      mywindow.document.write('.print-table {color: #000}');
      mywindow.document.write('.print-table {width:100%}');
      mywindow.document.write('.section-info h5 {font-size:15px;font-weight: 550}');
      mywindow.document.write('.section-info .print-table th{font-size:14px;border: 1px solid #000;font-weight: 400!important; background: #ededed}');
      mywindow.document.write('.section-info h5{font-size: 16px}');
      mywindow.document.write('.print-table th {text-align:center}');
      mywindow.document.write('.print-table th, .print-table td {font-size:15px!important;border: 1px solid #000; padding: 5px 5px;line-height: 22px}');
      mywindow.document.write('.text-unterline { border-bottom: 1px dashed #000; width: 100%; display: block; } .text-unterline-inline { border-bottom: 1px dashed #000; display: inline-block; } .print-table{ width: 100%; } .print-table tr td{ padding: 5px 10px; font-size: 13px; }');
      mywindow.document.write('.print-hide{display:none}');
      mywindow.document.write('.monjuri-text{margin-top: -2px}');
      //=======================Schedule List Course State
      mywindow.document.write('ul.course-date-list{ padding-left: 0; } .course-date-list li{ border-bottom: 1px solid #c7c7c7; list-style: none; text-align: center;display:block; } .course-date-list li:last-child{ border-bottom: none }');

      mywindow.document.write('}');
      mywindow.document.write('</style>');
      mywindow.document.write('</head><body style="background-color: #fff !important;" >');
      mywindow.document.write(document.getElementById(divName).innerHTML);
      mywindow.document.write('</body></html>');
      mywindow.document.close(); // necessary for IE >= 10
      mywindow.focus(); // necessary for IE >= 10*/

      setTimeout(function () {
        mywindow.print();
        var ival = setInterval(function () {
          mywindow.close();
          clearInterval(ival);
        }, 200);
      }, 500);
      return true;
    }
  </script>
  <script>
    function landscapPrintHTML(divName) {

      var mywindow = window.open('', 'PRINT', 'height=400,width=600');
      mywindow.document.write('<html><head><title></title>');
      mywindow.document.write('<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">');
      mywindow.document.write('<link href="/styles.scss" rel="stylesheet">');
      mywindow.document.write('<style>');
      mywindow.document.write('@media print{');
      mywindow.document.write('@page {size: A4 landscape;margin: 15mm 20mm; -webkit-print-color-adjust: exact;}');
      mywindow.document.write(' body {-webkit-print-color-adjust: exact;}');
      mywindow.document.write('.print-table {color: #000}');
      mywindow.document.write('.print-table {width:100%}');
      mywindow.document.write('.section-info h5 {font-size:15px;font-weight: 550}');
      mywindow.document.write('.section-info .print-table th{font-size:14px;border: 1px solid #000;font-weight: 400!important; background: #ededed}');
      mywindow.document.write('.section-info h5{font-size: 16px}');
      mywindow.document.write('.print-table th {text-align:center;verticle-align: middle}');
      mywindow.document.write('.print-table th, .print-table td {font-size:15px!important;border: 1px solid #000; padding: 5px 5px;line-height: 22px;}');
      mywindow.document.write('.text-unterline { border-bottom: 1px dashed #000; width: 100%; display: block; } .text-unterline-inline { border-bottom: 1px dashed #000; display: inline-block; } .print-table{ width: 100%; } .print-table tr td{ padding: 5px 10px; font-size: 13px; }');
      mywindow.document.write('.print-hide{display:none}');
      mywindow.document.write('.overlap-issue tr:nth-child(3n+0){ page-break-after: always;}');
      mywindow.document.write('.monjuri-text{margin-top: -2px}');
      //=======================Schedule List Course State
      mywindow.document.write('ul.course-date-list{ padding-left: 0; } .course-date-list li{ border-bottom: 1px solid #c7c7c7; list-style: none; text-align: center;display:block; } .course-date-list li:last-child{ border-bottom: none }');

      mywindow.document.write('}');
      mywindow.document.write('</style>');
      mywindow.document.write('</head><body style="background-color: #fff !important;" >');
      mywindow.document.write(document.getElementById(divName).innerHTML);
      mywindow.document.write('</body></html>');
      mywindow.document.close(); // necessary for IE >= 10
      mywindow.focus(); // necessary for IE >= 10*/

      setTimeout(function () {
        mywindow.print();
        var ival = setInterval(function () {
          mywindow.close();
          clearInterval(ival);
        }, 200);
      }, 500);
      return true;
    }
  </script>
